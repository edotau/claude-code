# Ghostty look, merged key-by-key into ~/.config/ghostty/config: mirrors the VS Code terminal (vscode.json).
theme = Ubuntu
background = #300a24
foreground = #c0c0c0
selection-background = #5f5961
selection-foreground = #ffffff
cursor-color = #c0c0c0
minimum-contrast = 4.5
bold-color = bright
window-theme = dark

font-family = Menlo
font-size = 13.5
cursor-style = block
cursor-style-blink = true

window-padding-x = 20
window-padding-y = 8
window-padding-color = extend
window-padding-balance = true

right-click-action = paste
copy-on-select = clipboard
clipboard-read = allow
clipboard-write = allow
clipboard-paste-protection = false
mouse-scroll-multiplier = precision:1,discrete:2
