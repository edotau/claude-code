model_provider = "databricks"
model = "databricks-gpt-6-1-sol"

[model_providers.databricks]
name = "Databricks serving"
base_url = "https://example.cloud.databricks.com/serving-endpoints"
wire_api = "responses"

[model_providers.databricks.auth]
command = "sh"
args = ["-c", "databricks auth token --host https://example.cloud.databricks.com --output json | jq -r '.access_token'"]
timeout_ms = 5000
refresh_interval_ms = 1800000
