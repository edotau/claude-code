<svg xmlns="http://www.w3.org/2000/svg" width="699" height="879" viewBox="0 0 699 879" role="img" aria-label="claude-code help menu">
<rect width="699" height="879" rx="10" fill="#1d1a22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="349.5" y="22" fill="#8a7e90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">$ claude-code</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="46" fill="#d7d4dc">usage: claude-code [&lt;command&gt;] [subcommand] [flags]</text>
<text x="22.0" y="65" fill="#d7d4dc">       claude-code &lt;command&gt; -h    per-command help</text>
<text x="22.0" y="103" fill="#8a7e90" font-weight="bold">ANTHROPIC</text>
<text x="22.0" y="122" fill="#d7d4dc">  </text>
<text x="38.8" y="122" fill="#4796e4" font-weight="bold">opus            </text>
<text x="173.2" y="122" fill="#d7d4dc">hardest reasoning: architecture, deep debugging · $$$</text>
<text x="22.0" y="141" fill="#d7d4dc">  </text>
<text x="38.8" y="141" fill="#4995e3" font-weight="bold">sonnet          </text>
<text x="173.2" y="141" fill="#d7d4dc">everyday coding, reviews, subagents · $$</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#4e93e1" font-weight="bold">haiku           </text>
<text x="173.2" y="160" fill="#d7d4dc">quick lookups, mechanical edits · $ fastest</text>
<text x="22.0" y="179" fill="#d7d4dc">  </text>
<text x="38.8" y="179" fill="#568fdf" font-weight="bold">fable           </text>
<text x="173.2" y="179" fill="#d7d4dc">separate frontier family; main-session default</text>
<text x="22.0" y="198" fill="#d7d4dc">  </text>
<text x="38.8" y="198" fill="#5f8bdb" font-weight="bold">science         </text>
<text x="173.2" y="198" fill="#d7d4dc">Claude for Life Sciences, own login (--print-env)</text>
<text x="22.0" y="236" fill="#8a7e90" font-weight="bold">AGENTS</text>
<text x="22.0" y="255" fill="#d7d4dc">  </text>
<text x="38.8" y="255" fill="#6987d8" font-weight="bold">copilot         </text>
<text x="173.2" y="255" fill="#d7d4dc">launch GitHub Copilot CLI on the registry; ask = one task</text>
<text x="22.0" y="274" fill="#d7d4dc">  </text>
<text x="38.8" y="274" fill="#7282d4" font-weight="bold">codex           </text>
<text x="173.2" y="274" fill="#d7d4dc">launch Codex CLI on the registry; ask = one task</text>
<text x="22.0" y="293" fill="#d7d4dc">  </text>
<text x="38.8" y="293" fill="#7a7ed1" font-weight="bold">gemini          </text>
<text x="173.2" y="293" fill="#d7d4dc">launch the gemini CLI; ask|bridge = large-context</text>
<text x="22.0" y="312" fill="#d7d4dc">  </text>
<text x="38.8" y="312" fill="#817ccf" font-weight="bold">opencode        </text>
<text x="173.2" y="312" fill="#d7d4dc">launch OpenCode on the registry; ask = one task</text>
<text x="22.0" y="350" fill="#8a7e90" font-weight="bold">AUTH</text>
<text x="22.0" y="369" fill="#d7d4dc">  </text>
<text x="38.8" y="369" fill="#847ace" font-weight="bold">secrets         </text>
<text x="173.2" y="369" fill="#d7d4dc">set|get|status, scan|git|all (audit), cred checks</text>
<text x="22.0" y="388" fill="#d7d4dc">  </text>
<text x="38.8" y="388" fill="#857acd" font-weight="bold">resolve         </text>
<text x="173.2" y="388" fill="#d7d4dc">resolve + print a provider&#39;s credential (apiKeyHelper)</text>
<text x="22.0" y="407" fill="#d7d4dc">  </text>
<text x="38.8" y="407" fill="#8978c7" font-weight="bold">profile         </text>
<text x="173.2" y="407" fill="#d7d4dc">providers + credential state; &lt;name&gt; shows its routes</text>
<text x="22.0" y="445" fill="#8a7e90" font-weight="bold">SESSION</text>
<text x="22.0" y="464" fill="#d7d4dc">  </text>
<text x="38.8" y="464" fill="#9076be" font-weight="bold">switch          </text>
<text x="173.2" y="464" fill="#d7d4dc">pin the session provider (env.d/provider.env)</text>
<text x="22.0" y="483" fill="#d7d4dc">  </text>
<text x="38.8" y="483" fill="#9a74b3" font-weight="bold">clean           </text>
<text x="173.2" y="483" fill="#d7d4dc">sweep accumulated state; --dry-run previews</text>
<text x="22.0" y="502" fill="#d7d4dc">  </text>
<text x="38.8" y="502" fill="#a471a7" font-weight="bold">history         </text>
<text x="173.2" y="502" fill="#d7d4dc">shadow git history of config + memory: snapshot|log|diff</text>
<text x="22.0" y="521" fill="#d7d4dc">  </text>
<text x="38.8" y="521" fill="#ad6d9a" font-weight="bold">memory          </text>
<text x="173.2" y="521" fill="#d7d4dc">two-layer session memory: namespaced + shared global bank</text>
<text x="22.0" y="540" fill="#d7d4dc">  </text>
<text x="38.8" y="540" fill="#b76b8f" font-weight="bold">setup           </text>
<text x="173.2" y="540" fill="#d7d4dc">adopt|nuke|workspace: migrate, wipe, or scope .claude/</text>
<text x="22.0" y="559" fill="#d7d4dc">  </text>
<text x="38.8" y="559" fill="#be6986" font-weight="bold">dispatch        </text>
<text x="173.2" y="559" fill="#d7d4dc">launch an agent on a tailnet host in tmux; --list|--attach</text>
<text x="22.0" y="578" fill="#d7d4dc">  </text>
<text x="38.8" y="578" fill="#c26780" font-weight="bold">web             </text>
<text x="173.2" y="578" fill="#d7d4dc">phone-friendly tailnet page: watch agents, dispatch new ones</text>
<text x="22.0" y="616" fill="#8a7e90" font-weight="bold">DIAGNOSTICS</text>
<text x="22.0" y="635" fill="#d7d4dc">  </text>
<text x="38.8" y="635" fill="#c3677f" font-weight="bold">doctor          </text>
<text x="173.2" y="635" fill="#d7d4dc">read-only harness health checks (--audit: typed action log)</text>
<text x="22.0" y="654" fill="#d7d4dc">  </text>
<text x="38.8" y="654" fill="#c66781" font-weight="bold">generate        </text>
<text x="173.2" y="654" fill="#d7d4dc">renders settings.json from the template (--out writes)</text>
<text x="22.0" y="673" fill="#d7d4dc">  </text>
<text x="38.8" y="673" fill="#cc6884" font-weight="bold">usage           </text>
<text x="173.2" y="673" fill="#d7d4dc">subagent token totals + peak input tokens/min (--days N)</text>
<text x="22.0" y="692" fill="#d7d4dc">  </text>
<text x="38.8" y="692" fill="#d46888" font-weight="bold">mcp             </text>
<text x="173.2" y="692" fill="#d7d4dc">doctor: MCP server health, scope drift, inline secrets</text>
<text x="22.0" y="711" fill="#d7d4dc">  </text>
<text x="38.8" y="711" fill="#de698c" font-weight="bold">describe        </text>
<text x="173.2" y="711" fill="#d7d4dc">machine-readable map: verbs, providers, runners, hooks</text>
<text x="22.0" y="730" fill="#d7d4dc">  </text>
<text x="38.8" y="730" fill="#e76991" font-weight="bold">tailscale       </text>
<text x="173.2" y="730" fill="#d7d4dc">tailnet: status | machines | connect | key | exit-node</text>
<text x="22.0" y="768" fill="#8a7e90" font-weight="bold">SETTINGS</text>
<text x="22.0" y="787" fill="#d7d4dc">  </text>
<text x="38.8" y="787" fill="#f06a96" font-weight="bold">configure       </text>
<text x="173.2" y="787" fill="#d7d4dc">guided setup: provider, login or key, models, agents</text>
<text x="22.0" y="806" fill="#d7d4dc">  </text>
<text x="38.8" y="806" fill="#f86b99" font-weight="bold">install         </text>
<text x="173.2" y="806" fill="#d7d4dc">install Claude Code + write settings.json (onboarding)</text>
<text x="22.0" y="825" fill="#d7d4dc">  </text>
<text x="38.8" y="825" fill="#fd6b9c" font-weight="bold">theme           </text>
<text x="173.2" y="825" fill="#d7d4dc">pick the statusline color (--preview to list)</text>
<text x="22.0" y="844" fill="#d7d4dc">  </text>
<text x="38.8" y="844" fill="#ff6b9d" font-weight="bold">vscode          </text>
<text x="173.2" y="844" fill="#d7d4dc">merge the tracked VS Code settings template (--check)</text>
</g></svg>
