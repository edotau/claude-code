<svg xmlns="http://www.w3.org/2000/svg" width="699" height="689" viewBox="0 0 699 689" role="img" aria-label="claude-code help menu">
<rect width="699" height="689" rx="10" fill="#1d1a22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="349.5" y="22" fill="#8a7e90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">$ claude-code</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="46" fill="#d7d4dc">usage: claude-code [&lt;command&gt;] [subcommand] [flags]</text>
<text x="22.0" y="65" fill="#d7d4dc">       claude-code &lt;command&gt; -h      per-command help</text>
<text x="22.0" y="84" fill="#d7d4dc">       claude-code --host &lt;h&gt; ...    run a command on a tailnet host</text>
<text x="22.0" y="103" fill="#d7d4dc">       claude-code --remote &lt;h&gt; ...  Databricks via &lt;h&gt;; login browser on &lt;h&gt;</text>
<text x="22.0" y="141" fill="#8a7e90" font-weight="bold">PROVIDERS</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#4796e4" font-weight="bold">anthropic       </text>
<text x="173.2" y="160" fill="#d7d4dc">Claude Code: --model opus|sonnet|haiku|fable; science</text>
<text x="22.0" y="179" fill="#d7d4dc">  </text>
<text x="38.8" y="179" fill="#4d93e2" font-weight="bold">databricks      </text>
<text x="173.2" y="179" fill="#d7d4dc">Claude Code on Databricks; login, import/export, check --all</text>
<text x="22.0" y="217" fill="#8a7e90" font-weight="bold">AGENTS</text>
<text x="22.0" y="236" fill="#d7d4dc">  </text>
<text x="38.8" y="236" fill="#5a8ddd" font-weight="bold">copilot         </text>
<text x="173.2" y="236" fill="#d7d4dc">Copilot CLI on its own login, or your Databricks profile</text>
<text x="22.0" y="255" fill="#d7d4dc">  </text>
<text x="38.8" y="255" fill="#6b85d7" font-weight="bold">codex           </text>
<text x="173.2" y="255" fill="#d7d4dc">Codex on your ChatGPT login; reviews</text>
<text x="22.0" y="274" fill="#d7d4dc">  </text>
<text x="38.8" y="274" fill="#7a7ed1" font-weight="bold">gemini          </text>
<text x="173.2" y="274" fill="#d7d4dc">Gemini CLI; 1M-context sweeps (ask --dirs)</text>
<text x="22.0" y="293" fill="#d7d4dc">  </text>
<text x="38.8" y="293" fill="#837ace" font-weight="bold">opencode        </text>
<text x="173.2" y="293" fill="#d7d4dc">OpenCode on its own login, or your Databricks profile; docs</text>
<text x="22.0" y="331" fill="#8a7e90" font-weight="bold">AUTH</text>
<text x="22.0" y="350" fill="#d7d4dc">  </text>
<text x="38.8" y="350" fill="#8779cb" font-weight="bold">gateway         </text>
<text x="173.2" y="350" fill="#d7d4dc">which agent + model a task routes to; the loopback proxy</text>
<text x="22.0" y="369" fill="#d7d4dc">  </text>
<text x="38.8" y="369" fill="#9376bc" font-weight="bold">network         </text>
<text x="173.2" y="369" fill="#d7d4dc">web search, browsers, remote agents</text>
<text x="22.0" y="388" fill="#d7d4dc">  </text>
<text x="38.8" y="388" fill="#a471a7" font-weight="bold">tailscale       </text>
<text x="173.2" y="388" fill="#d7d4dc">tailnet: status, connect, token, exit node, subnet</text>
<text x="22.0" y="407" fill="#d7d4dc">  </text>
<text x="38.8" y="407" fill="#b46b91" font-weight="bold">vault           </text>
<text x="173.2" y="407" fill="#d7d4dc">pins, env, overlays and sealed secrets</text>
<text x="22.0" y="445" fill="#8a7e90" font-weight="bold">SESSION</text>
<text x="22.0" y="464" fill="#d7d4dc">  </text>
<text x="38.8" y="464" fill="#c06882" font-weight="bold">clean           </text>
<text x="173.2" y="464" fill="#d7d4dc">sweep accumulated state; --dry-run previews</text>
<text x="22.0" y="483" fill="#d7d4dc">  </text>
<text x="38.8" y="483" fill="#c4677f" font-weight="bold">memory          </text>
<text x="173.2" y="483" fill="#d7d4dc">session memory bank: recall, save, promote</text>
<text x="22.0" y="502" fill="#d7d4dc">  </text>
<text x="38.8" y="502" fill="#cc6884" font-weight="bold">worktree        </text>
<text x="173.2" y="502" fill="#d7d4dc">manage worktrees in ~/worktrees/&lt;repo&gt;</text>
<text x="22.0" y="540" fill="#8a7e90" font-weight="bold">DIAGNOSTICS</text>
<text x="22.0" y="559" fill="#d7d4dc">  </text>
<text x="38.8" y="559" fill="#db698b" font-weight="bold">doctor          </text>
<text x="173.2" y="559" fill="#d7d4dc">read-only health checks (--audit: action log)</text>
<text x="22.0" y="578" fill="#d7d4dc">  </text>
<text x="38.8" y="578" fill="#ec6a94" font-weight="bold">usage           </text>
<text x="173.2" y="578" fill="#d7d4dc">token totals, peak rate, profile quotas, context by source</text>
<text x="22.0" y="616" fill="#8a7e90" font-weight="bold">SETTINGS</text>
<text x="22.0" y="635" fill="#d7d4dc">  </text>
<text x="38.8" y="635" fill="#f96b9a" font-weight="bold">configure       </text>
<text x="173.2" y="635" fill="#d7d4dc">guided setup; --restore resets settings.json</text>
<text x="22.0" y="654" fill="#d7d4dc">  </text>
<text x="38.8" y="654" fill="#ff6b9d" font-weight="bold">install         </text>
<text x="173.2" y="654" fill="#d7d4dc">install claude-code and agent links; seed settings.json</text>
</g></svg>
