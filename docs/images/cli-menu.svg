<svg xmlns="http://www.w3.org/2000/svg" width="674" height="784" viewBox="0 0 674 784" role="img" aria-label="claude-code help menu">
<rect width="674" height="784" rx="10" fill="#1d1a22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="337.0" y="22" fill="#8a7e90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">$ claude-code</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="46" fill="#d7d4dc">usage: claude-code [&lt;command&gt;] [subcommand] [flags]</text>
<text x="22.0" y="65" fill="#d7d4dc">       claude-code &lt;command&gt; -h    per-command help</text>
<text x="22.0" y="103" fill="#8a7e90" font-weight="bold">AGENTS</text>
<text x="22.0" y="122" fill="#d7d4dc">  </text>
<text x="38.8" y="122" fill="#4796e4" font-weight="bold">opus            </text>
<text x="173.2" y="122" fill="#d7d4dc">Claude Code, opus main model; args pass to claude</text>
<text x="22.0" y="141" fill="#d7d4dc">  </text>
<text x="38.8" y="141" fill="#4995e3" font-weight="bold">sonnet          </text>
<text x="173.2" y="141" fill="#d7d4dc">Claude Code, sonnet main model; args pass to claude</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#5092e1" font-weight="bold">haiku           </text>
<text x="173.2" y="160" fill="#d7d4dc">Claude Code, haiku main model; args pass to claude</text>
<text x="22.0" y="179" fill="#d7d4dc">  </text>
<text x="38.8" y="179" fill="#598edd" font-weight="bold">fable           </text>
<text x="173.2" y="179" fill="#d7d4dc">Claude Code, fable main model; args pass to claude</text>
<text x="22.0" y="198" fill="#d7d4dc">  </text>
<text x="38.8" y="198" fill="#6489da" font-weight="bold">copilot         </text>
<text x="173.2" y="198" fill="#d7d4dc">launch GitHub Copilot CLI on the registry; ask = one task</text>
<text x="22.0" y="217" fill="#d7d4dc">  </text>
<text x="38.8" y="217" fill="#6f84d6" font-weight="bold">codex           </text>
<text x="173.2" y="217" fill="#d7d4dc">launch Codex CLI on the registry; ask = one task</text>
<text x="22.0" y="236" fill="#d7d4dc">  </text>
<text x="38.8" y="236" fill="#787fd2" font-weight="bold">gemini          </text>
<text x="173.2" y="236" fill="#d7d4dc">launch the gemini CLI; ask|bridge = large-context</text>
<text x="22.0" y="255" fill="#d7d4dc">  </text>
<text x="38.8" y="255" fill="#807cd0" font-weight="bold">opencode        </text>
<text x="173.2" y="255" fill="#d7d4dc">launch OpenCode on the registry; ask = one task</text>
<text x="22.0" y="293" fill="#8a7e90" font-weight="bold">AUTH</text>
<text x="22.0" y="312" fill="#d7d4dc">  </text>
<text x="38.8" y="312" fill="#847ace" font-weight="bold">secrets         </text>
<text x="173.2" y="312" fill="#d7d4dc">set|get|status, scan|git|all (audit), cred checks</text>
<text x="22.0" y="331" fill="#d7d4dc">  </text>
<text x="38.8" y="331" fill="#857acd" font-weight="bold">resolve         </text>
<text x="173.2" y="331" fill="#d7d4dc">resolve + print a provider&#x27;s credential (apiKeyHelper)</text>
<text x="22.0" y="350" fill="#d7d4dc">  </text>
<text x="38.8" y="350" fill="#8b78c6" font-weight="bold">profile         </text>
<text x="173.2" y="350" fill="#d7d4dc">providers + credential state; &lt;name&gt; shows its routes</text>
<text x="22.0" y="388" fill="#8a7e90" font-weight="bold">SESSION</text>
<text x="22.0" y="407" fill="#d7d4dc">  </text>
<text x="38.8" y="407" fill="#9375bb" font-weight="bold">switch          </text>
<text x="173.2" y="407" fill="#d7d4dc">pin the session provider (env.d/provider.env)</text>
<text x="22.0" y="426" fill="#d7d4dc">  </text>
<text x="38.8" y="426" fill="#9e72ae" font-weight="bold">clean           </text>
<text x="173.2" y="426" fill="#d7d4dc">sweep accumulated state (dry-run; --apply deletes)</text>
<text x="22.0" y="445" fill="#d7d4dc">  </text>
<text x="38.8" y="445" fill="#a96f9f" font-weight="bold">history         </text>
<text x="173.2" y="445" fill="#d7d4dc">shadow git history of config + memory: snapshot|log|diff</text>
<text x="22.0" y="464" fill="#d7d4dc">  </text>
<text x="38.8" y="464" fill="#b46c92" font-weight="bold">science         </text>
<text x="173.2" y="464" fill="#d7d4dc">Claude for Life Sciences on its own OAuth (--print-env)</text>
<text x="22.0" y="483" fill="#d7d4dc">  </text>
<text x="38.8" y="483" fill="#bc6987" font-weight="bold">memory          </text>
<text x="173.2" y="483" fill="#d7d4dc">two-layer session memory: namespaced + shared global bank</text>
<text x="22.0" y="521" fill="#8a7e90" font-weight="bold">DIAGNOSTICS</text>
<text x="22.0" y="540" fill="#d7d4dc">  </text>
<text x="38.8" y="540" fill="#c26780" font-weight="bold">doctor          </text>
<text x="173.2" y="540" fill="#d7d4dc">read-only harness health checks (see also mcp doctor)</text>
<text x="22.0" y="559" fill="#d7d4dc">  </text>
<text x="38.8" y="559" fill="#c3677f" font-weight="bold">generate        </text>
<text x="173.2" y="559" fill="#d7d4dc">renders settings.json from the template (--out writes)</text>
<text x="22.0" y="578" fill="#d7d4dc">  </text>
<text x="38.8" y="578" fill="#c76781" font-weight="bold">usage           </text>
<text x="173.2" y="578" fill="#d7d4dc">subagent token totals + peak input tokens/min (--days N)</text>
<text x="22.0" y="597" fill="#d7d4dc">  </text>
<text x="38.8" y="597" fill="#ce6885" font-weight="bold">mcp             </text>
<text x="173.2" y="597" fill="#d7d4dc">doctor: MCP server health, scope drift, inline secrets</text>
<text x="22.0" y="616" fill="#d7d4dc">  </text>
<text x="38.8" y="616" fill="#d8688a" font-weight="bold">audit           </text>
<text x="173.2" y="616" fill="#d7d4dc">typed action log: switches, pins, secret sets, blocks</text>
<text x="22.0" y="635" fill="#d7d4dc">  </text>
<text x="38.8" y="635" fill="#e3698f" font-weight="bold">describe        </text>
<text x="173.2" y="635" fill="#d7d4dc">machine-readable map: verbs, providers, runners, hooks</text>
<text x="22.0" y="673" fill="#8a7e90" font-weight="bold">SETTINGS</text>
<text x="22.0" y="692" fill="#d7d4dc">  </text>
<text x="38.8" y="692" fill="#ed6a94" font-weight="bold">configure       </text>
<text x="173.2" y="692" fill="#d7d4dc">guided setup: provider, login or key, models, agents</text>
<text x="22.0" y="711" fill="#d7d4dc">  </text>
<text x="38.8" y="711" fill="#f66a99" font-weight="bold">install         </text>
<text x="173.2" y="711" fill="#d7d4dc">install Claude Code + write settings.json (onboarding)</text>
<text x="22.0" y="730" fill="#d7d4dc">  </text>
<text x="38.8" y="730" fill="#fd6b9c" font-weight="bold">theme           </text>
<text x="173.2" y="730" fill="#d7d4dc">pick the statusline color (--preview to list)</text>
<text x="22.0" y="749" fill="#d7d4dc">  </text>
<text x="38.8" y="749" fill="#ff6b9d" font-weight="bold">vscode          </text>
<text x="173.2" y="749" fill="#d7d4dc">merge the tracked VS Code settings template (--check)</text>
</g></svg>
