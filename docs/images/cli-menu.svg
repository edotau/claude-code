<text x="22.0" y="198" fill="#d7d4dc">  </text>
<text x="38.8" y="198" fill="#7183d5" font-weight="bold">opencode        </text>
<text x="173.2" y="198" fill="#d7d4dc">OpenCode on its own login, or your Databricks profile; docs</text>
<text x="22.0" y="217" fill="#d7d4dc">  </text>
