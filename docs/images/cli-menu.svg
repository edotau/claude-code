<text x="22.0" y="407" fill="#d7d4dc">  </text>
<text x="38.8" y="407" fill="#a471a7" font-weight="bold">history         </text>
<text x="173.2" y="407" fill="#d7d4dc">shadow git history of the config files</text>
<text x="22.0" y="426" fill="#d7d4dc">  </text>
<text x="38.8" y="426" fill="#b36c93" font-weight="bold">memory          </text>
