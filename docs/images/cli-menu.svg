<text x="22.0" y="502" fill="#8a7e90" font-weight="bold">DIAGNOSTICS</text>
<text x="22.0" y="521" fill="#d7d4dc">  </text>
<text x="38.8" y="521" fill="#c76781" font-weight="bold">doctor          </text>
<text x="173.2" y="521" fill="#d7d4dc">read-only health checks (--audit: action log)</text>
<text x="22.0" y="540" fill="#d7d4dc">  </text>
<text x="38.8" y="540" fill="#d36887" font-weight="bold">gateway         </text>
<text x="173.2" y="540" fill="#d7d4dc">which agent + model a task routes to; the loopback proxy</text>
<text x="22.0" y="559" fill="#d7d4dc">  </text>
<text x="38.8" y="559" fill="#e1698e" font-weight="bold">usage           </text>
<text x="173.2" y="559" fill="#d7d4dc">token totals, peak rate, profile quotas, context by source</text>
<text x="22.0" y="597" fill="#8a7e90" font-weight="bold">SETTINGS</text>
<text x="22.0" y="616" fill="#d7d4dc">  </text>
<text x="38.8" y="616" fill="#ef6a95" font-weight="bold">configure       </text>
<text x="173.2" y="616" fill="#d7d4dc">guided setup; --restore resets settings.json</text>
<text x="22.0" y="635" fill="#d7d4dc">  </text>
<text x="38.8" y="635" fill="#fb6b9b" font-weight="bold">install         </text>
<text x="173.2" y="635" fill="#d7d4dc">install claude-code and agent links; seed settings.json</text>
<text x="22.0" y="654" fill="#d7d4dc">  </text>
<text x="38.8" y="654" fill="#ff6b9d" font-weight="bold">theme           </text>
<text x="173.2" y="654" fill="#d7d4dc">palette, statusline, VS Code template, tool themes</text>
