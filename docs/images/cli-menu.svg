<text x="22.0" y="521" fill="#d7d4dc">  </text>
<text x="38.8" y="521" fill="#d56888" font-weight="bold">gateway         </text>
<text x="173.2" y="521" fill="#d7d4dc">which agent + model a task routes to; the loopback proxy</text>
<text x="22.0" y="540" fill="#d7d4dc">  </text>
<text x="38.8" y="540" fill="#e3698f" font-weight="bold">usage           </text>
