<svg xmlns="http://www.w3.org/2000/svg" width="691" height="841" viewBox="0 0 691 841" role="img" aria-label="claude-code help menu">
<rect width="691" height="841" rx="10" fill="#1d1a22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="345.5" y="22" fill="#8a7e90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">$ claude-code</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="46" fill="#d7d4dc">usage: claude-code [&lt;command&gt;] [subcommand] [flags]</text>
<text x="22.0" y="65" fill="#d7d4dc">       claude-code &lt;command&gt; -h    per-command help</text>
<text x="22.0" y="103" fill="#8a7e90" font-weight="bold">ANTHROPIC</text>
<text x="22.0" y="122" fill="#d7d4dc">  </text>
<text x="38.8" y="122" fill="#4796e4" font-weight="bold">opus            </text>
<text x="173.2" y="122" fill="#d7d4dc">hardest reasoning: architecture, deep debugging · $$$</text>
<text x="22.0" y="141" fill="#d7d4dc">  </text>
<text x="38.8" y="141" fill="#4995e3" font-weight="bold">sonnet          </text>
<text x="173.2" y="141" fill="#d7d4dc">everyday coding, reviews, subagents · $$</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#4f92e1" font-weight="bold">haiku           </text>
<text x="173.2" y="160" fill="#d7d4dc">quick lookups, mechanical edits · $ fastest</text>
<text x="22.0" y="179" fill="#d7d4dc">  </text>
<text x="38.8" y="179" fill="#588ede" font-weight="bold">fable           </text>
<text x="173.2" y="179" fill="#d7d4dc">separate frontier family; main-session default · $$$$</text>
<text x="22.0" y="198" fill="#d7d4dc">  </text>
<text x="38.8" y="198" fill="#628ada" font-weight="bold">science         </text>
<text x="173.2" y="198" fill="#d7d4dc">Claude for Life Sciences, own login (--print-env)</text>
<text x="22.0" y="236" fill="#8a7e90" font-weight="bold">AGENTS</text>
<text x="22.0" y="255" fill="#d7d4dc">  </text>
<text x="38.8" y="255" fill="#6c85d6" font-weight="bold">copilot         </text>
<text x="173.2" y="255" fill="#d7d4dc">Copilot CLI on your Copilot plan; pick any of 27 models</text>
<text x="22.0" y="274" fill="#d7d4dc">  </text>
<text x="38.8" y="274" fill="#7680d3" font-weight="bold">codex           </text>
<text x="173.2" y="274" fill="#d7d4dc">Codex on your ChatGPT login; second-opinion code reviews</text>
<text x="22.0" y="293" fill="#d7d4dc">  </text>
<text x="38.8" y="293" fill="#7e7dd0" font-weight="bold">gemini          </text>
<text x="173.2" y="293" fill="#d7d4dc">Gemini CLI; 1M-context repo sweeps (bridge) and research</text>
<text x="22.0" y="312" fill="#d7d4dc">  </text>
<text x="38.8" y="312" fill="#837ace" font-weight="bold">opencode        </text>
<text x="173.2" y="312" fill="#d7d4dc">OpenCode on your Copilot plan; docs and drafting</text>
<text x="22.0" y="350" fill="#8a7e90" font-weight="bold">AUTH</text>
<text x="22.0" y="369" fill="#d7d4dc">  </text>
<text x="38.8" y="369" fill="#847ace" font-weight="bold">secrets         </text>
<text x="173.2" y="369" fill="#d7d4dc">set|get|status, scan|git|all (audit), cred checks</text>
<text x="22.0" y="388" fill="#d7d4dc">  </text>
<text x="38.8" y="388" fill="#8879c9" font-weight="bold">profile         </text>
<text x="173.2" y="388" fill="#d7d4dc">providers + credential state; &lt;name&gt; shows its routes</text>
<text x="22.0" y="426" fill="#8a7e90" font-weight="bold">SESSION</text>
<text x="22.0" y="445" fill="#d7d4dc">  </text>
<text x="38.8" y="445" fill="#8f77c0" font-weight="bold">clean           </text>
<text x="173.2" y="445" fill="#d7d4dc">sweep accumulated state; --dry-run previews</text>
<text x="22.0" y="464" fill="#d7d4dc">  </text>
<text x="38.8" y="464" fill="#9974b4" font-weight="bold">history         </text>
<text x="173.2" y="464" fill="#d7d4dc">shadow git history of config + memory: snapshot|log|diff</text>
<text x="22.0" y="483" fill="#d7d4dc">  </text>
<text x="38.8" y="483" fill="#a471a7" font-weight="bold">dispatch        </text>
<text x="173.2" y="483" fill="#d7d4dc">launch an agent on a tailnet host in tmux; --list|--attach</text>
<text x="22.0" y="502" fill="#d7d4dc">  </text>
<text x="38.8" y="502" fill="#ae6d99" font-weight="bold">worktree        </text>
<text x="173.2" y="502" fill="#d7d4dc">~/worktrees/&lt;repo&gt;/&lt;name&gt;: list|clean|clean-all|create</text>
<text x="22.0" y="521" fill="#d7d4dc">  </text>
<text x="38.8" y="521" fill="#b86a8d" font-weight="bold">web             </text>
<text x="173.2" y="521" fill="#d7d4dc">tailnet agent page and dashboard; web search = Tavily</text>
<text x="22.0" y="559" fill="#8a7e90" font-weight="bold">DIAGNOSTICS</text>
<text x="22.0" y="578" fill="#d7d4dc">  </text>
<text x="38.8" y="578" fill="#bf6884" font-weight="bold">doctor          </text>
<text x="173.2" y="578" fill="#d7d4dc">read-only harness health checks (--audit: typed action log)</text>
<text x="22.0" y="597" fill="#d7d4dc">  </text>
<text x="38.8" y="597" fill="#c3677f" font-weight="bold">generate        </text>
<text x="173.2" y="597" fill="#d7d4dc">renders settings.json from the template (--out writes)</text>
<text x="22.0" y="616" fill="#d7d4dc">  </text>
<text x="38.8" y="616" fill="#c46780" font-weight="bold">usage           </text>
<text x="173.2" y="616" fill="#d7d4dc">subagent token totals + peak input tokens/min (--days N)</text>
<text x="22.0" y="635" fill="#d7d4dc">  </text>
<text x="38.8" y="635" fill="#c96782" font-weight="bold">mcp             </text>
<text x="173.2" y="635" fill="#d7d4dc">doctor: MCP server health, scope drift, inline secrets</text>
<text x="22.0" y="654" fill="#d7d4dc">  </text>
<text x="38.8" y="654" fill="#d16886" font-weight="bold">describe        </text>
<text x="173.2" y="654" fill="#d7d4dc">machine-readable map: verbs, providers, runners, hooks</text>
<text x="22.0" y="673" fill="#d7d4dc">  </text>
<text x="38.8" y="673" fill="#da698b" font-weight="bold">tailscale       </text>
<text x="173.2" y="673" fill="#d7d4dc">tailnet: status | machines | connect | key | exit-node</text>
<text x="22.0" y="711" fill="#8a7e90" font-weight="bold">SETTINGS</text>
<text x="22.0" y="730" fill="#d7d4dc">  </text>
<text x="38.8" y="730" fill="#e46990" font-weight="bold">install         </text>
<text x="173.2" y="730" fill="#d7d4dc">install Claude Code + write settings.json (onboarding)</text>
<text x="22.0" y="749" fill="#d7d4dc">  </text>
<text x="38.8" y="749" fill="#ee6a95" font-weight="bold">configure       </text>
<text x="173.2" y="749" fill="#d7d4dc">guided setup: provider, login or key, models, agents</text>
<text x="22.0" y="768" fill="#d7d4dc">  </text>
<text x="38.8" y="768" fill="#f76a99" font-weight="bold">theme           </text>
<text x="173.2" y="768" fill="#d7d4dc">pick the statusline color (--preview to list)</text>
<text x="22.0" y="787" fill="#d7d4dc">  </text>
<text x="38.8" y="787" fill="#fd6b9c" font-weight="bold">vscode          </text>
<text x="173.2" y="787" fill="#d7d4dc">merge the tracked VS Code settings template (--check)</text>
<text x="22.0" y="806" fill="#d7d4dc">  </text>
<text x="38.8" y="806" fill="#ff6b9d" font-weight="bold">memory          </text>
<text x="173.2" y="806" fill="#d7d4dc">two-layer session memory: namespaced + shared global bank</text>
</g></svg>
