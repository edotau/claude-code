<text x="22.0" y="141" fill="#d7d4dc">  </text>
<text x="38.8" y="141" fill="#4b94e3" font-weight="bold">copilot         </text>
<text x="173.2" y="141" fill="#d7d4dc">Copilot CLI on its own login, or your Databricks profile</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#558fdf" font-weight="bold">codex           </text>
