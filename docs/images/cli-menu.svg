<svg xmlns="http://www.w3.org/2000/svg" width="699" height="689" viewBox="0 0 699 689" role="img" aria-label="claude-code help menu">
<rect width="699" height="689" rx="10" fill="#1d1a22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="349.5" y="22" fill="#8a7e90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">$ claude-code</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="46" fill="#d7d4dc">usage: claude-code [&lt;command&gt;] [subcommand] [flags]</text>
<text x="22.0" y="65" fill="#d7d4dc">       claude-code &lt;command&gt; -h      per-command help</text>
<text x="22.0" y="84" fill="#d7d4dc">       claude-code --host &lt;h&gt; ...    run a command on a tailnet host</text>
<text x="22.0" y="103" fill="#d7d4dc">       claude-code --remote &lt;h&gt; ...  Databricks requests leave via &lt;h&gt;</text>
<text x="22.0" y="141" fill="#8a7e90" font-weight="bold">AGENTS</text>
<text x="22.0" y="160" fill="#d7d4dc">  </text>
<text x="38.8" y="160" fill="#4796e4" font-weight="bold">anthropic       </text>
<text x="173.2" y="160" fill="#d7d4dc">Claude Code: --model opus|sonnet|haiku|fable; science</text>
<text x="22.0" y="179" fill="#d7d4dc">  </text>
<text x="38.8" y="179" fill="#4c94e2" font-weight="bold">copilot         </text>
<text x="173.2" y="179" fill="#d7d4dc">Copilot CLI on its own login, or your Databricks profile</text>
<text x="22.0" y="198" fill="#d7d4dc">  </text>
<text x="38.8" y="198" fill="#578fde" font-weight="bold">codex           </text>
<text x="173.2" y="198" fill="#d7d4dc">Codex on your ChatGPT login; reviews</text>
<text x="22.0" y="217" fill="#d7d4dc">  </text>
<text x="38.8" y="217" fill="#6588d9" font-weight="bold">gemini          </text>
<text x="173.2" y="217" fill="#d7d4dc">Gemini CLI; 1M-context sweeps (ask --dirs)</text>
<text x="22.0" y="236" fill="#d7d4dc">  </text>
<text x="38.8" y="236" fill="#7481d4" font-weight="bold">opencode        </text>
<text x="173.2" y="236" fill="#d7d4dc">OpenCode on its own login, or your Databricks profile; docs</text>
<text x="22.0" y="255" fill="#d7d4dc">  </text>
<text x="38.8" y="255" fill="#7f7cd0" font-weight="bold">databricks      </text>
<text x="173.2" y="255" fill="#d7d4dc">Claude Code on Databricks; login, import/export, check --all</text>
<text x="22.0" y="293" fill="#8a7e90" font-weight="bold">AUTH</text>
<text x="22.0" y="312" fill="#d7d4dc">  </text>
<text x="38.8" y="312" fill="#847ace" font-weight="bold">network         </text>
<text x="173.2" y="312" fill="#d7d4dc">tailnet, browsers, web search, remote agents</text>
<text x="22.0" y="331" fill="#d7d4dc">  </text>
