# golangci-lint v2 config for `make lint-go`; gocognit reports only under CHECK=1.
version: "2"
# Matches VS Code: gopls formats like gofmt and organizes imports on save like goimports.
formatters:
  enable:
    - gofmt
    - goimports
linters:
  default: none
  enable:
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - bodyclose
    - noctx
    - gocognit
    - perfsprint
    - modernize
    - forbidigo
  settings:
    gocognit:
      min-complexity: 30
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.(Setenv|Unsetenv|Clearenv|Chdir)$'
          pkg: '^os$'
          msg: 'use internal/proc: process-wide state has one home'
  exclusions:
    rules:
      # internal/proc is the one home; hosttest is a test-helper package; tests restore their own state.
      - path: '(^|/)internal/(proc|hosttest)/|_test\.go$'
        linters: [forbidigo]
      - path: _test\.go
        linters:
          - gocognit
      # Tests: fixture writes and exec/HTTP calls without ctx are bounded by the test itself.
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose]
      # Best-effort CLI/terminal output: a failed write to stdout/stderr has no recovery path.
      - linters: [errcheck]
        text: 'Error return value of .fmt\.Fprint'
      # Deferred Close runs after the primary result is decided; its error cannot change it.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)'
