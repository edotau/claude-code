# mdsmith (make lint-docs): tracked harness markdown, tuned to rules/standards (120-col lines, fenced languages).
front-matter: true
files:
  - "*.md"
  - "agents/**/*.md"
  - "commands/**/*.md"
  - "rules/**/*.md"
  - "skills/**/*.md"
  - "docs/**/*.md"
  - "theme/**/*.md"
  - "vscode/**/*.md"
  - "internal/memory/templates/*.md"
# Commands whose body is a raw `!bash` script: markdown fixers would rewrite the shell code.
ignore:
  - "commands/codex/adversarial-review.md"
  - "commands/harness/techdebt.md"
  - "commands/workflow/worktree.md"
  - "commands/workflow/orchestrate.md"
overrides:
  - glob: ["internal/memory/templates/*.md"]
    rules:
      empty-section-body: false
rules:
  # Mirrors .markdownlint-cli2.jsonc (converted with bin/mdsmith init --from-markdownlint) so make lint matches VS Code.
  code-block-style:
    style: fenced
  commands-show-output: false
  emphasis-style:
    bold: asterisk
    italic: asterisk
  fenced-code-style:
    style: backtick
  heading-style:
    style: atx
  horizontal-rule-style:
    length: 3
    style: dash
  list-marker-style:
    style: dash
  required-structure: false
  single-h1: true
  ambiguous-emphasis: true
  no-space-in-code-spans: true
  no-space-in-link-text: true
  line-length:
    max: 120
    exclude: [code-blocks, tables, urls]
  heading-increment: true
  fenced-code-language: true
  cross-file-reference-integrity: true
  no-trailing-spaces: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  # Style choices the harness docs don't follow; off rather than churn every file.
  paragraph-readability: false
  no-duplicate-headings: false # per-section repeats ("Verification Steps") are intentional structure
  table-format: false
  table-readability: false
  list-indent: false
  no-emphasis-as-heading: false
  first-line-heading: false
  max-file-length: false
  token-budget: false
