# mdsmith (make lint-docs): tracked harness markdown, tuned to rules/standards (120-col lines, fenced languages).
front-matter: true
files:
  - "*.md"
  - "agents/**/*.md"
  - "commands/**/*.md"
  - "rules/**/*.md"
  - "skills/**/*.md"
  - "docs/**/*.md"
  - "internal/memory/templates/*.md"
overrides:
  - glob: ["internal/memory/templates/*.md"]
    rules:
      empty-section-body: false
rules:
  line-length:
    max: 120
    exclude: [code-blocks, tables, urls]
  heading-increment: true
  fenced-code-language: true
  cross-file-reference-integrity: true
  no-trailing-spaces: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  # Style choices the harness docs don't follow; off rather than churn every file.
  paragraph-readability: false
  no-duplicate-headings: false # per-section repeats ("Verification Steps") are intentional structure
  table-format: false
  table-readability: false
  list-indent: false
  no-emphasis-as-heading: false
  first-line-heading: false
  max-file-length: false
  token-budget: false
