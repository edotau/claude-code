# mdsmith (make lint-docs): the gate twin of .markdownlint.json; mdlint.Parity fails on drift.
front-matter: true
files:
  - "**/*.md"
ignore:
  - "internal/**/testdata/**"
overrides:
  - glob: [".github/**/*.md"] # GitHub forms: the title is front matter, sections hold only an HTML-comment prompt
    rules:
      empty-section-body: false
      heading-increment: false
  - glob: ["internal/assets/memory/templates/*.md"] # seed blank slots the updater fills; text there would enter the bank
    rules:
      empty-section-body: false
  - glob: ["docs/templates/examples/memory/*.md"] # generated verbatim: MEMORY.md/index.md have no H1 and no blanks
    rules:
      line-length: false # the Layout and catalog lines are rendered by Go, unwrapped
      heading-increment: false
      blank-line-around-headings: false
      blank-line-around-lists: false
      code-block-style: false # index.md records are 4-space indented on purpose
      no-undefined-reference-labels: false # catalog rows end in [<entry id>], not a link label
  - glob: ["memory/**/*.md"] # the live store is untracked and generated: 4-space records
    rules:
      code-block-style: false
rules:
  # Rules: converted from .markdownlint.json, then the deliberate differences in internal/mdlint/parity.go.
  # Deliberate: list-indent off (MD007 off; MD005 hand-checked), MD010 code_blocks and MD024 siblings_only have no
  # mdsmith option, mdsmith-only rules below are gate-only (D6).
  code-block-style:
    style: fenced
  commands-show-output: false
  emphasis-style:
    bold: asterisk
    italic: asterisk
  fenced-code-style:
    style: backtick
  heading-style:
    style: atx
  horizontal-rule-style:
    length: 3
    style: dash
  list-marker-style:
    style: dash
  required-structure: false
  single-h1: true
  ambiguous-emphasis: true
  no-space-in-code-spans: true
  no-space-in-link-text: true
  table-format: false # alignment padded prose tables to 1,500 columns; tables stay compact (owner, 2026-11-26)
  line-length:
    max: 120
    stern: true
    exclude: [code-blocks, tables, urls]
  heading-increment: true
  fenced-code-language: true
  cross-file-reference-integrity: true
  no-trailing-spaces: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  # Style choices the harness docs don't follow; off rather than churn every file.
  paragraph-readability: false
  no-duplicate-headings: false # per-section repeats ("Verification Steps") are intentional structure
  table-readability: false
  list-indent: false
  no-emphasis-as-heading: false
  first-line-heading: false
  max-file-length: false
  token-budget: false
