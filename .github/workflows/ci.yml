# Go correctness gate = `make audit` (gofmt/vet/test/build + generated-projection smoke), shared with .githooks/pre-push.
# Free tier: one job, module+build cache, cancel-in-progress, and it runs only on main + PRs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # One gate, one definition: `make audit` is what the pre-push hook (.githooks/pre-push) runs locally,
      # so CI can only fail on something the push already saw. Steps live in the Makefile, not here.
      - name: make audit (gofmt, vet, test, build, generated-projection smoke)
        run: NO_COLOR=1 make audit
