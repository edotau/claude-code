# Go correctness gate = `make audit` (gofmt/vet/test/build + generated-projection smoke), the same target run locally.
# Free tier (public repo): one job per OS, module+build cache, cancel-in-progress, manual runs only.
# macOS is first-class (the team runs it); fail-fast off so one OS's failure still reports the other.
name: ci

on:
  # CI is off for cost (owner, 2026-11-08); validation runs locally before every push (`make audit`). Manual run only.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: AUDIT_GIT_RANGE below needs the push/PR base commit to diff against
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # One gate, one definition: `make audit` is what the owner runs locally before pushing (no pre-push hook),
      # so CI can only fail on something that run already saw. Steps live in the Makefile, not here.
      # Pinned tool versions live in the Makefile; this also smoke-tests make install on each OS's throwaway runner.
      - name: make install DEV_TOOLS=1 (harness + govulncheck, golangci-lint, yamlfmt)
        run: make install DEV_TOOLS=1
      - name: make audit (gofmt, vet, test, build, generated-projection smoke)
        run: NO_COLOR=1 make audit
